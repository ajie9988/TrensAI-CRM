version: 2
updates:
  # Maintain dependencies for pnpm (Monorepo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"

  # Maintain dependencies for PHP (Backend)
  - package-ecosystem: "composer"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Maintain Docker images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/wa-engine"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/ai-engine"
    schedule:
      interval: "weekly"
