version: '3.8'

services:
  # ===========================================
  # NGINX REVERSE PROXY
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: wa_crm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./apps/backend:/var/www/backend:ro
      - ./apps/frontend/.next:/var/www/frontend/.next:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wa_crm_network
    restart: unless-stopped

  # ===========================================
  # BACKEND - LARAVEL API
  # ===========================================
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: wa_crm_backend
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=cookie
      - SANCTUM_STATEFUL_DOMAINS=localhost,127.0.0.1,localhost:3000
      - WA_ENGINE_URL=http://wa-engine:3001
      - AI_ENGINE_URL=http://ai-engine:3002
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
    volumes:
      - ./apps/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    depends_on:
      - mysql
      - redis
    networks:
      - wa_crm_network
    restart: unless-stopped
    command: >
      sh -c "
        php artisan migrate:fresh --seed &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  # ===========================================
  # FRONTEND - NEXT.JS
  # ===========================================
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: wa_crm_frontend
    environment:
      - NODE_ENV=${APP_ENV:-production}
      - NEXT_PUBLIC_API_URL=${APP_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${APP_URL:-http://localhost:8000}
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - wa_crm_network
    restart: unless-stopped

  # ===========================================
  # WHATSAPP ENGINE - NODE.JS + BAILEYS
  # ===========================================
  wa-engine:
    build:
      context: ./apps/wa-engine
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: wa_crm_wa_engine
    environment:
      - NODE_ENV=${APP_ENV:-production}
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKEND_URL=http://backend:8000
      - API_KEY=${WA_ENGINE_API_KEY}
    volumes:
      - ./apps/wa-engine:/app
      - /app/node_modules
      - wa_engine_sessions:/app/sessions
    depends_on:
      - redis
      - backend
    networks:
      - wa_crm_network
    restart: unless-stopped
    expose:
      - "3001"

  # ===========================================
  # AI ENGINE - NODE.JS
  # ===========================================
  ai-engine:
    build:
      context: ./apps/ai-engine
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: wa_crm_ai_engine
    environment:
      - NODE_ENV=${APP_ENV:-production}
      - PORT=3002
      - BACKEND_URL=http://backend:8000
      - API_KEY=${AI_ENGINE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ./apps/ai-engine:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - wa_crm_network
    restart: unless-stopped
    expose:
      - "3002"

  # ===========================================
  # WORKER - BACKGROUND JOBS
  # ===========================================
  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: wa_crm_worker
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    volumes:
      - ./apps/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    depends_on:
      - mysql
      - redis
      - backend
    networks:
      - wa_crm_network
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3

  # ===========================================
  # MYSQL DATABASE
  # ===========================================
  mysql:
    image: mysql:8.0
    container_name: wa_crm_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "3306:3306"
    networks:
      - wa_crm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ===========================================
  # REDIS CACHE & QUEUE
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: wa_crm_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - wa_crm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  # ===========================================
  # OLLAMA (Optional - Local LLM)
  # ===========================================
  ollama:
    image: ollama/ollama:latest
    container_name: wa_crm_ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - wa_crm_network
    restart: unless-stopped
    # Uncomment to enable GPU support (if available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  wa_crm_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_vendor:
  backend_storage:
  wa_engine_sessions:
  ollama_data:
